name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk SanskritNET.apk
      - uses: actions/upload-artifact@v4
        with: { name: SanskritNET-apk, path: SanskritNET.apk }
      - name: Publish download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Android app (latest)
          body: Download SanskritNET.apk below and open it on your phone. The app loads the live website, so site updates need no new APK.
          files: SanskritNET.apk
